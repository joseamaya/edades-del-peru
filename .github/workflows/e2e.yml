name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PRs: the @smoke subset, sharded in two so the gate stays fast.
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Detect whether the PR only changes documentation
        id: changes
        run: |
          if ! git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! names=$(git diff --name-only FETCH_HEAD HEAD); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$names" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$names" | grep -qvE '\.md$' || printf '%s\n' "$names" | grep -qE '^docs/historia/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
        if: steps.changes.outputs.code == 'true'
      - name: Cache Playwright browsers
        if: steps.changes.outputs.code == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      # A cache hit already holds the browser; skipping `--with-deps` avoids a needless apt run
      # (and keeps the job alive through a transient Ubuntu mirror/DNS outage).
      - name: Install Playwright chromium
        if: steps.changes.outputs.code == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: E2E smoke (shard ${{ matrix.shard }}/2)
        if: steps.changes.outputs.code == 'true'
        run: yarn test:e2e:smoke --shard=${{ matrix.shard }}/2
      - name: Upload Playwright report
        if: ${{ steps.changes.outputs.code == 'true' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # main / manual: the fast project, sharded in four. The heavy specs
  # (ai/campaign-completable/settlement/save) run in the nightly workflow.
  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      # A cache hit already holds the browser; skipping `--with-deps` avoids a needless apt run
      # (and keeps the job alive through a transient Ubuntu mirror/DNS outage).
      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: E2E fast (shard ${{ matrix.shard }}/4)
        run: yarn test:e2e:fast --shard=${{ matrix.shard }}/4
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
