name: E2E nightly (slow specs)

on:
  schedule:
    # 03:00 UTC daily
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIGHTLY_QUERY: repo:${{ github.repository }} is:issue is:open in:title "[nightly]"
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: npx playwright install --with-deps chromium
      - name: E2E slow specs
        id: e2e
        timeout-minutes: 40
        run: yarn test:e2e:slow --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: nightly-report.json
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-slow
          path: |
            nightly-report.json
            playwright-report/
            test-results/
          retention-days: 7
      - name: Track nightly failure
        if: ${{ failure() && steps.e2e.outcome == 'failure' && github.ref == 'refs/heads/main' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const failed = [];
            const flaky = [];
            try {
              const report = JSON.parse(fs.readFileSync('nightly-report.json', 'utf8'));
              const walk = (suite) => {
                for (const spec of suite.specs ?? []) {
                  const label = `${spec.file}: ${spec.title}`;
                  if ((spec.tests ?? []).some((t) => t.status === 'unexpected')) failed.push(label);
                  else if ((spec.tests ?? []).some((t) => t.status === 'flaky')) flaky.push(label);
                }
                for (const child of suite.suites ?? []) walk(child);
              };
              for (const suite of report.suites ?? []) walk(suite);
            } catch (error) {
              core.warning(`Could not read nightly-report.json: ${error.message}`);
            }
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              `The nightly E2E suite failed on \`${context.ref}\` (${today}).`,
              '',
              `**Run:** ${process.env.RUN_URL}`,
              failed.length ? `**Failed tests:**\n${failed.map((t) => `- \`${t}\``).join('\n')}` : '',
              flaky.length ? `**Flaky tests (passed on retry):**\n${flaky.map((t) => `- \`${t}\``).join('\n')}` : '',
              '',
              'The Playwright report is attached to the run (`playwright-report-slow` artifact, kept for 7 days).',
              '',
              'Refs #342. This issue closes automatically when the suite is green again.',
            ]
              .filter(Boolean)
              .join('\n');
            const open = await github.rest.search.issuesAndPullRequests({
              q: process.env.NIGHTLY_QUERY,
              per_page: 1,
            });
            if (open.data.items.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.data.items[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[nightly] Slow E2E suite failing (${today})`,
                body,
                labels: ['tests'],
              });
            }
      - name: Close nightly issue on green
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.e2e.outcome == 'success' }}
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.search.issuesAndPullRequests({
              q: process.env.NIGHTLY_QUERY,
              per_page: 1,
            });
            if (!open.data.items.length) return;
            const issue_number = open.data.items[0].number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `The nightly E2E suite is green again: ${process.env.RUN_URL}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              state: 'closed',
            });
